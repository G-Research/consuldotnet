version: 2
updates:
  # ---------- CI: version updates ----------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
      github-actions:
        patterns:
          - "*"

  # ---------- .NET / NuGet: security updates only ----------
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---------- docs site (npm): security updates only ----------
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
