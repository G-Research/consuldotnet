name: zizmor

# Static analysis of GitHub Actions workflows with zizmor
# (https://docs.zizmor.sh). Results are uploaded as SARIF to
# Code Scanning; findings do not fail the build.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # SARIF upload to Code Scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          min-severity: low
          min-confidence: low
